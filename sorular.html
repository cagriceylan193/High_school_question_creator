<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sorular · Soru Üreteci</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="siteHeader" data-page="questions"></header>

  <main class="wrap">
    <section id="start" class="panel">
      <h1 data-i18n="startTitle">Sınava başla</h1>
      <p class="lead" data-i18n="startLead"></p>
      <p class="account-note" id="accountNote"></p>
      <form id="startForm" class="grid">
        <div class="fields">
          <label class="field"><span data-i18n="studentLabel"></span>
            <input type="text" id="student" autocomplete="name" required>
          </label>
          <label class="field"><span data-i18n="codeLabel"></span>
            <input type="text" id="code" required>
          </label>
          <label class="field"><span data-i18n="countLabel"></span>
            <input type="number" id="count" min="1" max="100" required>
          </label>
        </div>
        <div class="field" id="topicsWrap">
          <span class="small muted" data-i18n="topicsLabel"></span>
          <div class="chips" id="topics"></div>
        </div>
        <div class="field">
          <span class="small muted" data-i18n="levelsLabel"></span>
          <div class="chips" id="levels"></div>
        </div>
        <div class="field">
          <span class="small muted" data-i18n="formatsLabel"></span>
          <div class="chips" id="formats"></div>
        </div>
        <label class="check-inline"><input type="checkbox" id="fresh" checked> <span data-i18n="freshLabel"></span></label>
        <div class="actions"><button type="submit" class="primary" data-i18n="startBtn"></button></div>
      </form>
      <p id="emptyNote" class="notice" data-i18n="noQuestions" hidden></p>
    </section>

    <section id="exam" hidden>
      <div class="panel">
        <div class="exam-head">
          <div>
            <h1 id="examTitle"></h1>
            <p class="muted small" id="examHint" data-i18n="answerHint"></p>
          </div>
          <div class="exam-tools no-print">
            <button type="button" id="pdfBtn" data-i18n="pdfDownload"></button>
            <label class="check-inline" id="pdfKeyWrap"><input type="checkbox" id="pdfKey"> <span data-i18n="pdfWithKey"></span></label>
            <button type="button" id="newExam" data-i18n="newExam"></button>
          </div>
        </div>
        <p class="error small" id="pdfStatus" aria-live="polite"></p>
        <ol class="questions" id="questions"></ol>
        <div class="actions">
          <button type="button" id="checkBtn" class="primary" data-i18n="check"></button>
          <button type="button" id="clearBtn" data-i18n="retry"></button>
          <span class="score" id="score" aria-live="polite"></span>
        </div>
        <p class="notice" id="savedNote" hidden></p>
      </div>
    </section>
  </main>
  <footer id="siteFooter"></footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="engine.js"></script>
  <!-- Soru dosyaları: yeni bir dosya eklediğinizde buraya, index.html'e ve ogretmen.html'e de ekleyin -->
  <script src="figures.js"></script>
  <script src="questions/_maarif.js"></script>
  <script src="questions/fizik.js"></script>
  <script src="questions/fizik-madde.js"></script>
  <script src="questions/fizik-hareket.js"></script>
  <script src="questions/fizik-elektrik-optik.js"></script>
  <script src="questions/fizik-maarif.js"></script>
  <script src="questions/fizik-yazili.js"></script>
  <script src="questions/ornekler.js"></script>
  <script src="account.js"></script>
  <script src="ui.js"></script>
  <script src="cloud.js"></script>
  <script src="assistant.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
